[workspace]
members = [
    "crates/vexrec-core",
    "crates/vexrec-os",
    "crates/vexrec-display",
    "crates/vexrec-render",
    "crates/vexrec-media",
    "crates/vexrec-ui",
    "crates/vexrec-cli",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["Larvance <dev@larvance.com>"]
license = "MIT"
repository = "https://github.com/larvance/vexrec"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
rustix = { version = "1.1", features = ["event", "fs", "mm", "net", "pipe", "process", "shm", "thread", "time"] }
libloading = "0.9"
memmap2 = "0.9"
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
async-io = "2.6"
futures-lite = "2.6"
polling = "3.11"
calloop = "0.14"
x11rb = { version = "0.14", features = ["shm", "composite", "damage", "dri3", "xfixes", "randr", "shape", "cursor", "xkb", "present"] }
wayland-client = "0.31"
wayland-cursor = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop"] }
ash = { version = "0.38", default-features = false, features = ["loaded"] }
fontdue = "0.9"
rtrb = "0.4"
nnnoiseless = "0.5"
opus-pure = "0.2"
png = "0.18"
jpeg-encoder = "0.7"
image-webp = "0.2"
gif = "0.14"
rav1e = { version = "0.8", default-features = false, features = ["threading"] }
openh264 = "0.9"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"

[profile.dev]
opt-level = 1
debug = 0
incremental = true

[profile.test]
opt-level = 2
debug = 0

[profile.release]
opt-level = 3
debug = 0
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
